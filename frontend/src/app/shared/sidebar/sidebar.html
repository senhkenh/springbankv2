<aside class="bank-sidebar">
  <!-- Brand -->
  <div class="sidebar-brand">
    <a routerLink="/" class="brand-logo">
      <i class="fa-solid fa-landmark"></i>
      <span>SpringBank</span>
    </a>
    <span class="brand-tag">Banca Personas</span>
  </div>

  <!-- User card -->
  <div class="sidebar-user">
    <div class="user-avatar">{{ userInitial }}</div>
    <div class="user-info">
      <strong>{{ userName }}</strong>
      <span>{{ userRut }}</span>
    </div>
    <div class="user-badge"><i class="fa-solid fa-circle-check"></i></div>
  </div>

  <!-- Nav links -->
  <nav class="sidebar-nav">
    <span class="nav-group-label">Principal</span>
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <div class="nav-icon"><i class="fa-solid fa-chart-line"></i></div>
      <span>Resumen</span>
    </a>
    <a routerLink="/accounts" routerLinkActive="active" class="nav-item">
      <div class="nav-icon"><i class="fa-solid fa-wallet"></i></div>
      <span>Mis Cuentas</span>
    </a>
    <a routerLink="/transfer" routerLinkActive="active" class="nav-item">
      <div class="nav-icon"><i class="fa-solid fa-right-left"></i></div>
      <span>Transferencias</span>
    </a>

    <span class="nav-group-label">Productos</span>
    <a routerLink="/tarjetas" class="nav-item">
      <div class="nav-icon"><i class="fa-solid fa-credit-card"></i></div>
      <span>Tarjetas</span>
    </a>
    <a routerLink="/creditos" class="nav-item">
      <div class="nav-icon"><i class="fa-solid fa-hand-holding-dollar"></i></div>
      <span>Créditos</span>
    </a>
    <a routerLink="/inversiones" class="nav-item">
      <div class="nav-icon"><i class="fa-solid fa-chart-pie"></i></div>
      <span>Inversiones</span>
    </a>
    <a routerLink="/seguros" class="nav-item">
      <div class="nav-icon"><i class="fa-solid fa-shield-halved"></i></div>
      <span>Seguros</span>
    </a>

    <span class="nav-group-label">Soporte</span>
    <a routerLink="/ayuda" class="nav-item">
      <div class="nav-icon"><i class="fa-solid fa-circle-question"></i></div>
      <span>Ayuda</span>
    </a>
  </nav>

  <!-- Footer sidebar -->
  <div class="sidebar-footer">
    <button class="sidebar-logout" (click)="logout()">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>Cerrar sesión</span>
    </button>
  </div>
</aside>
